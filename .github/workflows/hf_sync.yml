name: Sync to Hugging Face Spaces

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 1
          lfs: true

      - name: Reset Git History for Clean Push
        run: |
          # Remove existing Git history to prevent uploading historical heavy models
          rm -rf .git
          
          # Initialize fresh repository
          git init -b main
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          
          # Initialize LFS
          git lfs install
          
          # Stage and commit only current files (ignores what is in .gitignore)
          git add .
          git commit -m "deploy: clean sync with lightweight models"

      - name: Push to HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git remote add hf https://user:$HF_TOKEN@huggingface.co/spaces/lewischu/phishing-attack-detection
          git push --force hf main:refs/heads/main
